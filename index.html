<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F6F4EF">
  <meta name="description" content="Registro pessoal de treinos, tênis e corridas oficiais.">
  <title>Diário de Corrida</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="login-view" class="login-view">
    <div class="login-card">
      <p class="eyebrow">Uso pessoal</p>
      <h1>Diário de Corrida</h1>
      <p class="muted">Registre treinos, acompanhe a quilometragem dos tênis e compare sua evolução.</p>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="login-user">Usuário</label>
          <input id="login-user" name="user" type="text" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="login-pass">Senha</label>
          <input id="login-pass" name="pass" type="password" autocomplete="current-password" required>
        </div>
        <p id="login-error" class="form-error" role="alert" hidden></p>
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      </form>
    </div>
  </section>

  <div id="app-view" class="app-view" hidden>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">DC</span>
        <div>
          <strong>Diário de Corrida</strong>
          <small class="muted">Treinos, tênis e provas</small>
        </div>
      </div>
      <div class="topbar-actions">
        <button type="button" id="shoes-open" class="btn">Tênis</button>
        <span id="user-label" class="user-label mono"></span>
        <button type="button" id="logout-btn" class="btn">Sair</button>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Seções">
      <button type="button" class="tab is-active" data-tab="calendario" role="tab" aria-selected="true" aria-controls="tab-calendario">Calendário</button>
      <button type="button" class="tab" data-tab="graficos" role="tab" aria-selected="false" aria-controls="tab-graficos">Gráficos</button>
      <button type="button" class="tab" data-tab="corridas" role="tab" aria-selected="false" aria-controls="tab-corridas">Corridas oficiais</button>
    </nav>

    <main class="content">
      <section id="tab-calendario" class="tab-panel" role="tabpanel">
        <div id="calendar-view"></div>
      </section>
      <section id="tab-graficos" class="tab-panel" role="tabpanel" hidden>
        <div id="charts-view"></div>
      </section>
      <section id="tab-corridas" class="tab-panel" role="tabpanel" hidden>
        <div id="races-view"></div>
      </section>
    </main>

    <footer class="footer muted">
      <span>Dados salvos neste navegador.</span>
      <span class="footer-actions">
        <button type="button" id="backup-export" class="btn btn-small">Exportar backup</button>
        <button type="button" id="backup-import" class="btn btn-small">Importar backup</button>
        <input type="file" id="backup-file" accept="application/json,.json" hidden>
      </span>
    </footer>
  </div>

  <div id="modal-root" class="modal-root" hidden>
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 id="modal-title"></h2>
        <button type="button" class="icon-btn" data-modal-close aria-label="Fechar">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
</body>
</html>
